name = "cuellar-photography-local"
compatibility_date = "2026-08-18"
main = "worker/src/index.ts"

[[d1_databases]]
binding = "DB"
database_name = "cuellar-photography-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "database/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cuellar-photography-media-local"